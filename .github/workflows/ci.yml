name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19", "24"]
        # Real Windows verification: the suite is platform-neutral, and the
        # browser-open / credential paths must behave without macOS services.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  bundle-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Client bundle require-face audit (no removed platform packages)
        run: |
          test -f packages/dsh-plugin/lib/client.js
          if grep -q 'dsh-client-runtime' packages/dsh-plugin/lib/client.js; then
            echo "::error::client bundle still references dsh-client-runtime"
            exit 1
          fi
          grep -o 'require("[^"]*")' packages/dsh-plugin/lib/client.js | sort | uniq -c

  macos-gates:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Keychain helper Swift syntax gate
        run: xcrun swiftc -parse packages/vault/src/macos-keychain-helper.swift
